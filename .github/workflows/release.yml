name: Personal Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Personal branch commit to build (defaults to codex/personal-client)"
        required: false
        type: string
      publish:
        description: "Compatibility input; unsigned Mac builds remain drafts until local signing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: personal-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Pin the personal release commit
    if: github.repository == 'TgolMsk/OpenMausBot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'codex/personal-client' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Pin and validate the source
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = TgolMsk/OpenMausBot
          git merge-base --is-ancestor HEAD origin/codex/personal-client
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./package.json').version")
          node --input-type=module - "$version" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.match(process.argv[2], /^\d+\.\d+\.\d+$/);
          assert.match(readFileSync('electron-builder.yml', 'utf8'), /owner: TgolMsk/);
          assert.match(readFileSync('shared/personal-client.ts', 'utf8'), /PERSONAL_CLIENT = true/);
          NODE
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::v$version is already published; bump package.json before rebuilding"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mac:
    name: macOS Apple silicon
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      OPENMAUSBOT_CUA_ARCHES: arm64
      OPENMAUSBOT_CUA_ARCHES_PARTIAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release policy
        run: pnpm exec vitest run scripts/verify-personal-release.test.ts scripts/personal-release-workflow.test.ts electron/updater.test.mjs
      - run: pnpm clean
      - name: Build the Apple silicon app and installers
        run: |
          pnpm package:prepare
          pnpm build:speech
          pnpm build:cua
          pnpm exec electron-builder --mac --arm64 --publish never --config.mac.identity=- --config.dmg.sign=false
      - name: Verify the packaged browser and server
        env:
          OMB_SMOKE_DIST: ${{ github.workspace }}/release/mac-arm64/OpenMausBot.app/Contents/Resources/server
        run: |
          resources="$PWD/release/mac-arm64/OpenMausBot.app/Contents/Resources"
          node scripts/smoke-browser-bundle.mjs --resources "$resources"
          node scripts/smoke-packaged-server.mjs --browser-bundle "$resources/browser-engine"
      - name: Verify the fork feed and installer hashes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/regenerate-blockmaps.mjs "release/OpenMausBot-$VERSION-arm64.zip" "release/OpenMausBot-$VERSION-arm64.dmg"
          node scripts/verify-personal-release.mjs --dir release --platform mac --version "$VERSION" --resources "release/mac-arm64/OpenMausBot.app/Contents/Resources"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm clean
      - run: pnpm package:win
      - name: Verify the packaged browser and server
        env:
          OMB_SMOKE_DIST: ${{ github.workspace }}/release/win-unpacked/resources/server
        run: |
          node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
          node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - name: Verify the fork feed and installer hashes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for file in release/*.exe release/*.zip; do
            node scripts/regenerate-blockmaps.mjs "$file"
          done
          node scripts/verify-personal-release.mjs --dir release --platform win --version "$VERSION" --resources release/win-unpacked/resources
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Stage the complete draft release
    needs: [prepare, mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: personal-*
          merge-multiple: true
          path: assets
      - name: Verify the downloaded release bytes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/verify-personal-release.mjs --dir assets --platform all --version "$VERSION"
      - name: Record build provenance
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('assets/build-metadata.json', JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY, version: process.env.VERSION,
            commit: process.env.SHA, macSigned: false, macArch: 'arm64', windowsArch: 'x64',
            run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }, null, 2) + '\n');
          NODE
      - name: Create and upload the same-commit draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          test "$GITHUB_REPOSITORY" = TgolMsk/OpenMausBot
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).isDraft" "$RUNNER_TEMP/release.json")" = true
            target=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).targetCommitish" "$RUNNER_TEMP/release.json")
            target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq .sha)
            test "$target_sha" = "$SHA" || { echo "::error::the existing draft targets another commit"; exit 1; }
          else
            printf '自用版 %s，构建提交 %s。\n\nWindows 安装包已准备；Mac 产物须先在本机签名、公证并重新生成更新索引后发布。\n' "$VERSION" "$SHA" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft --title "OpenMausBot Personal $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          for file in assets/*; do
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
          {
            echo "### Draft v$VERSION"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
            echo "Mac artifacts require local signing and notarization before publication; publish=$PUBLISH_REQUESTED does not bypass this."
          } >> "$GITHUB_STEP_SUMMARY"
